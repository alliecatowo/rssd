name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install libxml2-utils
        # The well-formedness gate shells out to xmllint on purpose: checking
        # our XML with our own parser would not prove much.
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - run: uv sync --locked --python ${{ matrix.python }} --extra tui --extra fulltext

      - name: Run tests
        # No network is required; the suite serves the committed fixtures
        # over localhost.
        run: uv run pytest -q

  # The repo ruleset requires a check named exactly `test`; this is the single
  # gate that is green only when every matrix leg is.
  test:
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success"
