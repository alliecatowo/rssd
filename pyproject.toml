[project]
name = "rssd"
version = "0.1.0"
description = "A file-based RSS daemon: the filesystem is the API"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Allie Coleman" }]
keywords = ["rss", "atom", "feed", "daemon", "filesystem", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "watchfiles>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/alliecatowo/rssd"
Documentation = "https://alliecatowo.github.io/rssd/"
Source = "https://github.com/alliecatowo/rssd"
Issues = "https://github.com/alliecatowo/rssd/issues"

[project.optional-dependencies]
tui = ["textual>=8.2.8"]
fulltext = ["trafilatura>=2.2.0"]

[project.scripts]
# Two binaries on purpose: `rssd` writes the tree, `rss` only reads it.
rssd = "rssd.cli:main"
rss = "rssd.readercli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # feedparser warns once per entry that it is falling back from
    # updated_parsed to published_parsed. We handle both explicitly in
    # parse.py, and 500 copies of the notice drowns out real output.
    "ignore:To avoid breaking existing software:DeprecationWarning",
]
